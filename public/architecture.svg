<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fdf4" />
      <stop offset="100%" stop-color="#d1fae5" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#064e3b" flood-opacity="0.1" />
    </filter>
    <style>
      .box { fill: #ffffff; stroke: #10b981; stroke-width: 2; filter: url(#shadow); rx: 8; ry: 8; }
      .box-header { fill: #10b981; rx: 8; ry: 8; }
      .text-title { font-family: system-ui, sans-serif; font-size: 18px; font-weight: bold; fill: #ffffff; }
      .text-body { font-family: system-ui, sans-serif; font-size: 14px; fill: #064e3b; }
      .text-sm { font-family: system-ui, sans-serif; font-size: 12px; fill: #047857; }
      .line { stroke: #34d399; stroke-width: 3; fill: none; stroke-dasharray: 6 4; animation: dash 20s linear infinite; }
      .arrow { fill: #34d399; }
      @keyframes dash { to { stroke-dashoffset: -1000; } }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1000" height="600" fill="url(#bg-gradient)" rx="16" ry="16" />
  <text x="500" y="40" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#064e3b" text-anchor="middle">NestJS + LangChain + AGUI Architecture</text>

  <!-- Frontend Node -->
  <g transform="translate(50, 200)">
    <rect class="box" width="220" height="140" />
    <path d="M 0 8 Q 0 0 8 0 L 212 0 Q 220 0 220 8 L 220 40 L 0 40 Z" fill="#10b981" />
    <text x="110" y="26" class="text-title" text-anchor="middle">React Frontend</text>
    <text x="20" y="70" class="text-body">• Vite + Tailwind CSS</text>
    <text x="20" y="95" class="text-body">• @ai-sdk/react (useChat)</text>
    <text x="20" y="120" class="text-body">• Streamdown (Markdown)</text>
  </g>

  <!-- Connection: Frontend to Backend -->
  <path class="line" d="M 270 250 L 370 250" />
  <polygon class="arrow" points="370,250 360,245 360,255" />
  <text x="320" y="240" class="text-sm" text-anchor="middle">POST /ai/chat</text>
  
  <path class="line" d="M 370 290 L 270 290" />
  <polygon class="arrow" points="270,290 280,285 280,295" />
  <text x="320" y="310" class="text-sm" text-anchor="middle">AGUI Stream (SSE)</text>

  <!-- Backend Node -->
  <g transform="translate(380, 150)">
    <rect class="box" width="240" height="240" />
    <path d="M 0 8 Q 0 0 8 0 L 232 0 Q 240 0 240 8 L 240 40 L 0 40 Z" fill="#059669" />
    <text x="120" y="26" class="text-title" text-anchor="middle">NestJS Backend</text>
    <text x="20" y="70" class="text-body">• AiController (API)</text>
    <text x="20" y="100" class="text-body">• AiService (Logic)</text>
    <text x="20" y="130" class="text-body">• JobAgentService</text>
    <rect x="20" y="150" width="200" height="60" rx="4" ry="4" fill="#ecfdf5" stroke="#34d399" stroke-width="1" />
    <text x="120" y="170" class="text-body" font-weight="bold" text-anchor="middle">LangChain Agent</text>
    <text x="120" y="195" class="text-sm" text-anchor="middle" font-size="10" letter-spacing="-0.5">createAgent() + toUIMessageStream</text>
  </g>

  <!-- Connection: Backend to LLM -->
  <path class="line" d="M 500 150 L 500 80 L 730 80" />
  <polygon class="arrow" points="730,80 720,75 720,85" />
  <text x="615" y="70" class="text-sm" text-anchor="middle">OpenAI Compatible API</text>

  <!-- LLM Node -->
  <g transform="translate(740, 50)">
    <rect class="box" width="200" height="80" />
    <path d="M 0 8 Q 0 0 8 0 L 192 0 Q 200 0 200 8 L 200 30 L 0 30 Z" fill="#047857" />
    <text x="100" y="20" class="text-title" text-anchor="middle" font-size="14">LLM Model</text>
    <text x="100" y="60" class="text-body" text-anchor="middle">e.g., Qwen-Plus</text>
  </g>

  <!-- Connection: Backend to Tools -->
  <path class="line" d="M 620 250 L 730 250" />
  <polygon class="arrow" points="730,250 720,245 720,255" />
  <text x="675" y="240" class="text-sm" text-anchor="middle">Tool Calling</text>

  <!-- Tools Node -->
  <g transform="translate(740, 170)">
    <rect class="box" width="200" height="180" />
    <path d="M 0 8 Q 0 0 8 0 L 192 0 Q 200 0 200 8 L 200 35 L 0 35 Z" fill="#059669" />
    <text x="100" y="23" class="text-title" text-anchor="middle">Tools</text>
    <text x="20" y="65" class="text-body">🌐 web_search (Bocha)</text>
    <text x="20" y="95" class="text-body">✉️ send_mail (SMTP)</text>
    <text x="20" y="125" class="text-body">👥 db_users_crud</text>
    <text x="20" y="155" class="text-body">⏰ cron_job</text>
  </g>

  <!-- Connection: Backend/Tools to DB -->
  <path class="line" d="M 500 390 L 500 450" />
  <polygon class="arrow" points="500,450 495,440 505,440" />
  
  <path class="line" d="M 840 350 L 840 480 L 630 480" />
  <polygon class="arrow" points="630,480 640,475 640,485" />

  <!-- Database Node -->
  <g transform="translate(380, 450)">
    <rect class="box" width="240" height="100" />
    <path d="M 0 8 Q 0 0 8 0 L 232 0 Q 240 0 240 8 L 240 35 L 0 35 Z" fill="#047857" />
    <text x="120" y="23" class="text-title" text-anchor="middle">Milvus Vector DB</text>
    <text x="120" y="65" class="text-body" text-anchor="middle">Vector Storage</text>
    <text x="120" y="85" class="text-sm" text-anchor="middle">Collections: user, job</text>
  </g>

</svg>
